name: Enviar FCM

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [enviar-fcm]
  workflow_dispatch:
    inputs:
      uid:
        description: "UID do usuário destinatário"
        required: true
        type: string
      tipo:
        description: "Tipo da notificação"
        required: true
        type: choice
        options:
          - mensagem
          - aviso
          - atualizacao
          - manutencao
          - geral
      titulo:
        description: "Título"
        required: true
        type: string
      texto:
        description: "Mensagem"
        required: true
        type: string
        remetente_uid:
          description: "UID do remetente (mensagem)"
          required: false
          type: string
        fila_id:
          description: "ID do documento da fila (opcional)"
          required: false
          type: string
permissions:
  contents: read
  id-token: write

jobs:
  enviar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/724683245123/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: firebase-adminsdk-fbsvc@da-nike-films.iam.gserviceaccount.com

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar Firebase Admin
        run: pip install -r requirements.txt

      - name: Processar fila automática
        if: github.event_name == 'schedule'
        run: python scripts/processar_notificacoes.py

      - name: Enviar notificação
        if: github.event_name != 'schedule'
        env:
          NOTIFICACAO_UID: ${{ github.event.client_payload.uid || inputs.uid }}
          NOTIFICACAO_TIPO: ${{ github.event.client_payload.tipo || inputs.tipo }}
          NOTIFICACAO_TITULO: ${{ github.event.client_payload.titulo || inputs.titulo }}
          NOTIFICACAO_TEXTO: ${{ github.event.client_payload.texto || inputs.texto }}
          NOTIFICACAO_REMETENTE_UID: ${{ github.event.client_payload.remetente_uid || inputs.remetente_uid }}
          NOTIFICACAO_FILA_ID: ${{ github.event.client_payload.fila_id || inputs.fila_id }}
        run: python scripts/send_fcm.py
